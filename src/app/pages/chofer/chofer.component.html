<div class="modulo-container">
  <div class="header-section">
    <h2>Gestión de Choferes</h2>
    <button mat-raised-button class="btn-primary" (click)="nuevoChofer()">
      <mat-icon>person_add</mat-icon> Nuevo Chofer
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar chofer (Nombre, Licencia, etc.)</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Ej. Juan Pérez">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="table-container mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="idChofer">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> ID </th>
        <td mat-cell *matCellDef="let chofer"> {{chofer.idChofer}} </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre Completo </th>
        <td mat-cell *matCellDef="let chofer"> {{chofer.nombre}} </td>
      </ng-container>

      <ng-container matColumnDef="licencia">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Licencia </th>
        <td mat-cell *matCellDef="let chofer"> {{chofer.licencia}} </td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Teléfono </th>
        <td mat-cell *matCellDef="let chofer"> {{chofer.telefono}} </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let chofer">
          <button mat-icon-button color="primary" (click)="editarChofer(chofer)" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarChofer(chofer.idChofer)" title="Dar de baja">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="5">No se encontraron choferes con el criterio buscado.</td>
      </tr>
    </table>
  </div>
</div>
