<div class="modulo-container">
  <div class="header-section">
    <h2>Flota de Unidades</h2>
    <button mat-raised-button class="btn-primary" (click)="null">
      <mat-icon>add_box</mat-icon> Nueva Unidad
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar por placas, tipo o chofer</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Ej. ABC-123">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="table-container mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="placas">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Placas </th>
        <td mat-cell *matCellDef="let unidad" class="bold-text"> {{unidad.placas}} </td>
      </ng-container>

      <ng-container matColumnDef="tipoUnidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
        <td mat-cell *matCellDef="let unidad">
          {{unidad.tipoUnidad}}
          <mat-icon *ngIf="unidad.tieneRefrigeracion" class="refrigeration-icon" matTooltip="Cuenta con refrigeración">ac_unit</mat-icon>
        </td>
      </ng-container>

      <ng-container matColumnDef="chofer">
        <th mat-header-cell *matHeaderCellDef> Chofer </th>
        <td mat-cell *matCellDef="let unidad">
          {{ unidad.chofer?.nombre || 'Sin asignar' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="capacidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Capacidad (Kg) </th>
        <td mat-cell *matCellDef="let unidad"> {{unidad.capacidadCarga | number}} </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estado </th>
        <td mat-cell *matCellDef="let unidad">
          <span class="status-badge" [ngClass]="getEstadoClass(unidad.estadoOperativo)">
            {{unidad.estadoOperativo}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let unidad">
          <button mat-icon-button color="primary" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="eliminarUnidad(unidad.idUnidadTransporte)" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25]" pageSize="10" showFirstLastButtons></mat-paginator>
  </div>
</div>
